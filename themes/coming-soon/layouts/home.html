{{ define "main" }}
    <div>
        <div class='mainbg'>
            {{ if .Site.Params.backgroundImage }}
                <img src="{{ .Site.Params.backgroundImage }}" alt="Background" class="background-image">
            {{ else }}
                <video autoplay muted loop>
                    {{ if .Site.Params.background }}
                        <source src="{{ .Site.Params.backgroundVideo }}" type="video/mp4">
                    {{ else }}
                        <source src="bg.mp4" type="video/mp4">
                    {{ end }}
                </video>
            {{ end }}
            <div class='content'>
                <div class='glass-panel'>
                    <div class='contenthead'>
                        <h3 class='contentheading'>{{ .Site.Params.title }}</h3>
                    </div>
                    <div class='contenttypewritter animatedText'></div>
                    <div class='contentbtn'>
                        {{ range .Site.Params.links }}
                            <a href="{{ .url }}" class='btn btn-outline-light' role='button' 
                                {{ if or (.newTab | default false) }}
                                    target="_blank"
                                {{ else }}
                                    target="_self"
                                {{ end }}
                            >{{ .name }}</a>
                        {{ end }}
                      </div>
                </div>
            </div>
        </div>
    </div>

    <aside class="review-mascot" aria-label="Review prompt">
        <div class="review-mascot__bubble">
            <a class="review-mascot__btn" href="https://kuremi.vercel.app/" target="_blank" rel="noopener noreferrer">Review me :3</a>
        </div>
        <img class="review-mascot__img" src="{{ "review-mascot.gif" | relURL }}" width="120" height="140" alt="Manga character asking for a review">
    </aside>

    <!-- JS for typewritter -->
    <script>
        const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
    </script>
    <script src='/js/script.js'></script>
{{ end }}
